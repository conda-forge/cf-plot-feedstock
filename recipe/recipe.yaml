schema_version: 1

context:
  version: "3.5.0"

package:
  name: cf-plot
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/cf-plot/cf_plot-${{ version }}.tar.gz
  sha256: 05feafdb9de06644e82d3d31c0b189850f87af632735a80a881c39ea80aa9526

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68
    - pip
  run:
    - python >=${{ python_min }}
    - cf-python >=3.17.0
    - scipy >=1.4.0
    - cartopy >=0.22.0
    # Not declared
    # - matplotlib-base >=3.1.0
    # - scipy >=1.4.0

tests:
  - python:
      imports:
        - cfplot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Code-light plotting for earth science and aligned research
  license: MIT
  license_file: LICENSE.txt
  homepage: https://ncas-cms.github.io/cf-plot/

extra:
  recipe-maintainers:
    - sadielbartholomew
    - ocefpaf
